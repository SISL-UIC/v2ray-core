name: Test
jobs:
  test:
    if: 'false'
    runs-on: self-hosted
    strategy:
      matrix:
        os:
        - ubuntu-latest
      fail-fast: false
    steps:
    - name: Set up Go 1.x
      uses: actions/setup-go@v2
      with:
        go-version: ^1.15
    - name: Checkout codebase
      uses: actions/checkout@v2
    - name: Cache go module
      uses: actions/cache@v2
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: ${{ runner.os }}-go-
    - name: Test
      run: go test -timeout 1h -v ./...
    timeout-minutes: 6
env:
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
'on':
  push:
    branches:
    - master
    paths:
    - '**/*.go'
    - go.mod
    - go.sum
  pull_request:
    branches:
    - master
    types:
    - opened
    - synchronize
    - reopened
    paths:
    - '**/*.go'
    - go.mod
    - go.sum
